# CI: fmt, clippy (-D warnings), tests and the first-run module build
# (`firstrun` job) on every push/PR.
#
# The workspace builds the decomp C via pw64-game's build.rs with the
# project's one C compiler, zig 0.16.0 (T13, docs/notes/first-run-build.md):
# the same compiler + flags the players' first-run builder uses. Every job
# fetches it with the get_zig example (official archive, sha256-pinned in
# pw64-cbuild) into tools/zig/, cached per OS. No LLVM install needed.
# The WSL reference build and the ROM/data assets are NOT part of CI
# (rom/, data/ are gitignored and never committed, per CONTRIBUTING.md).

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Incremental off + releasedisk? Keep it simple: debug tests are fast enough.
  CARGO_INCREMENTAL: 0

# A newer push to the same branch cancels the older run (saves runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows · fmt, clippy, tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # decomp/ (read-only reference, needed by build.rs)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: zig
        with:
          path: tools/zig
          key: zig-0.16.0-tools-${{ runner.os }}
      - name: zig (get_zig example, sha256-checked)
        if: steps.zig.outputs.cache-hit != 'true'
        run: cargo run -p pw64-cbuild --example get_zig --features fetch
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  # The whole workspace on x86_64 Linux, incl. the native C build (zig clang
  # in GNU mode, exe linked non-PIE at 0xC0000000 by rust-lld) and the OS-core
  # tests (docs/notes/native-build.md §10). Packages: libasound2-dev (cpal
  # ALSA), libudev-dev (gilrs), libdbus-1-dev (btleplug BlueZ), pkg-config
  # for the -sys crates.
  linux:
    name: Linux · fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # decomp/ (read-only reference, needed by build.rs)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: system packages
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev libdbus-1-dev pkg-config
      - uses: actions/cache@v4
        id: zig
        with:
          path: tools/zig
          key: zig-0.16.0-tools-${{ runner.os }}
      - name: zig (get_zig example, sha256-checked)
        if: steps.zig.outputs.cache-hit != 'true'
        run: cargo run -p pw64-cbuild --example get_zig --features fetch
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  # macOS arm64 (macos-14): the native Darwin test bed for the macOS/iOS
  # platform code. Same zig + clippy + tests as the Linux job, no extra
  # packages. continue-on-error while the Darwin port is new.
  macos:
    name: macOS arm64 · fmt, clippy, tests
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # decomp/ (read-only reference, needed by build.rs)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: zig
        with:
          path: tools/zig
          key: zig-0.16.0-tools-${{ runner.os }}
      - name: zig (get_zig example, sha256-checked)
        if: steps.zig.outputs.cache-hit != 'true'
        run: cargo run -p pw64-cbuild --example get_zig --features fetch
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace --no-fail-fast

  # Android arm64 (docs/notes/android.md): compile + clippy only, no device
  # tests and no APK signing yet. The decomp C is built by zig as on every
  # target (no bionic needed: -nostdinc); rustc links the app library with
  # the NDK clang. The cdylib step proves that link (NativeActivity entry,
  # liblog/libandroid/libaaudio).
  android:
    name: Android arm64 · clippy, cdylib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # decomp/ (read-only reference, needed by build.rs)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: zig
        with:
          path: tools/zig
          key: zig-0.16.0-tools-${{ runner.os }}
      - name: zig (get_zig example, sha256-checked)
        if: steps.zig.outputs.cache-hit != 'true'
        run: cargo run -p pw64-cbuild --example get_zig --features fetch
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          # No local-cache: its restore dropped the NDK's clang symlink
          # (aarch64-linux-android26-clang: "bin/clang: No such file").
      - name: NDK toolchain env
        run: |
          bin="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
      - name: clippy
        run: >
          cargo clippy --target aarch64-linux-android --all-targets
          -p birdman64 -p pw64-game -p pw64-platform -p pw64-cbuild -- -D warnings
      - name: app library (cdylib)
        # Same 16 KB LOAD alignment as build-apk.sh (Android 15+ devices).
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
        run: cargo rustc -p birdman64 --lib --crate-type cdylib --target aarch64-linux-android

  # Release-flavour APK (docs/notes/android.md): no game C, zig as
  # libzig.so, licences, stripped, not debuggable. Always debug-signed here:
  # the release key is used only by release.yml, never on push/PR.
  android-apk:
    name: Android release-flavour APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk # own cache (release profile, cargo-about binary)
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: cargo-about (THIRD_PARTY_LICENSES.html)
        run: cargo about --version || cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: build-apk.sh --release-flavour
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash packaging/android/build-apk.sh --release-flavour
      - uses: actions/upload-artifact@v4
        with:
          name: Birdman64-android-arm64-debugsigned
          path: target/android-apk/Birdman64-android-arm64-debugsigned.apk

  # iOS arm64 (macos-14): clippy for the device target, then the ipa builds
  # (device + simulator) and a simulator smoke run: the app must reach the
  # ROM screen without a ROM and leave a screenshot of it. Device IPA is a
  # dev build with the game C linked in: a CI artifact only, never a release
  # asset (unsigned — installing it is out of scope). continue-on-error
  # while the iOS port is new.
  ios:
    name: iOS arm64 · clippy, ipa, simulator smoke
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # decomp/ (read-only reference, needed by build.rs)
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: zig
        with:
          path: tools/zig
          key: zig-0.16.0-tools-${{ runner.os }}
      - name: zig (get_zig example, sha256-checked)
        if: steps.zig.outputs.cache-hit != 'true'
        run: cargo run -p pw64-cbuild --example get_zig --features fetch
      - name: clippy
        run: cargo clippy --target aarch64-apple-ios --all-targets -p birdman64 -- -D warnings
      - name: device ipa (unsigned dev build)
        run: bash packaging/ios/build-ipa.sh
      - name: simulator app
        run: bash packaging/ios/build-ipa.sh --sim
      - name: simulator smoke run
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(d[k][0]["udid"] for k in d if k.startswith("com.apple.CoreSimulator.SimRuntime.iOS")))') \
            || { echo "no available iOS simulator"; exit 1; }
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" target/ios/sim/Payload/Birdman64.app
          # Plain launch returns at once (--console-pty would block until the
          # app exits, which it never does); stdout/stderr go to host files.
          SIMCTL_CHILD_PW64_NO_AUDIO=1 xcrun simctl launch \
            --stdout="$PWD/ios-sim.log" --stderr="$PWD/ios-sim.log" \
            "$UDID" app.birdman64 || true
          sleep 30
          xcrun simctl io "$UDID" screenshot ios-sim.png
          tail -20 ios-sim.log || true
          xcrun simctl terminate "$UDID" app.birdman64 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim
          path: |
            ios-sim.png
            ios-sim.log
      - uses: actions/upload-artifact@v4
        with:
          name: ios-dev-ipa
          retention-days: 7
          path: target/ios/Birdman64.ipa

  # First-run module build (docs/notes/first-run-build.md T12), both release
  # platforms, every push: builds the game module with zig via the
  # pw64-cbuild example (network-free: the checked-out decomp is
  # hash-checked against the pinned manifest, which also validates T5), then
  # runs the dylib test on the result. New libultra imports in the C show up
  # here as an lld "undefined symbol": add X(name) to pw64_dll_imports.h.
  firstrun:
    name: First-run game build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # decomp/ sources, hash-checked by the build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same zig + cache as the test/linux jobs.
      - uses: actions/cache@v4
        id: zig
        with:
          path: tools/zig
          key: zig-0.16.0-tools-${{ runner.os }}
      - name: zig (get_zig example, sha256-checked)
        if: steps.zig.outputs.cache-hit != 'true'
        run: cargo run -p pw64-cbuild --example get_zig --features fetch
      - name: build the game module
        shell: pwsh
        run: |
          if ($IsWindows) { $exe = 'tools/zig/zig.exe' } else { $exe = 'tools/zig/zig' }
          cargo run -p pw64-cbuild --example build_module --features fetch -- `
            --zig $exe --decomp-dir decomp --out tmp/firstrun
      - name: dylib test on the built module
        shell: pwsh
        run: |
          $pat = if ($IsWindows) { 'tmp/firstrun/game/*/pw64game.dll' } else { 'tmp/firstrun/game/*/libpw64game.so' }
          $mod = Get-Item $pat | Select-Object -First 1
          if (-not $mod) { throw "no module under tmp/firstrun/game/" }
          $env:PW64_GAME_DLL = $mod.FullName  # absolute: cargo runs tests from the crate dir
          cargo test --release -p pw64-game --no-default-features --features dylib
