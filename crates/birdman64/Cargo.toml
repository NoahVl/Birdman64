[package]
name = "birdman64"
description = "Birdman64: native PC port of Pilotwings 64"
version.workspace = true
edition.workspace = true
license.workspace = true

# The app is a library (lib.rs) behind a thin desktop exe (main.rs). Android
# builds the same library as the APK's `.so`, overriding the crate type at
# build time: `cargo rustc -p birdman64 --lib --crate-type cdylib`
# (docs/notes/android.md), so desktop builds produce no extra artifact.
[lib]
name = "birdman64"
path = "src/lib.rs"

[features]
# Release build (`release.yml`): `windows_subsystem = "windows"`, i.e. no
# console window for a double-clicked exe. Off by default: developers keep
# stderr.
gui-subsystem = []
# Game C linked into the exe (dev default). Exactly one of static-game /
# first-run: release builds use `--no-default-features --features first-run`.
default = ["static-game"]
static-game = ["pw64-game/static"]
# Release: no decomp code in the exe; the game module is built on the
# player's machine and loaded at runtime (docs/notes/first-run-build.md).
first-run = ["pw64-game/dylib", "dep:pw64-cbuild"]
# Relocatable exe + game module (docs/notes/option-a.md S7): no fixed image
# bases; runs only with PW64_RELOC on/alias/strict (default on).
reloc = ["pw64-game/reloc", "pw64-cbuild?/reloc"]

[dependencies]
pw64-game = { path = "../pw64-game", default-features = false }
pw64-gfx = { path = "../pw64-gfx" }
pw64-platform = { path = "../pw64-platform" }
pw64-audio.workspace = true
pw64-formats.workspace = true
pw64-rom.workspace = true
anyhow.workspace = true
btleplug.workspace = true
env_logger.workspace = true
futures.workspace = true
gilrs.workspace = true
uuid.workspace = true
# first-run: fetch the decomp + build the game module (firstrun.rs).
pw64-cbuild = { workspace = true, features = ["fetch"], optional = true }
serde.workspace = true
serde_json.workspace = true
winit.workspace = true
log.workspace = true
png.workspace = true
wgpu.workspace = true
toml.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
resvg.workspace = true

# First-run ROM picker (rom_setup.rs): native dialog, no winit/wgpu coupling.
# No Android or iOS backend (src/android/rfd.rs / src/ios/rfd.rs stand in there).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd.workspace = true

# iOS (paths.rs): the app's Documents folder via Foundation. That folder is
# the data dir, the ROM scan root and what the Files app shows the player.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation.workspace = true
# GameController pads (src/input/ios_gc.rs).
objc2-game-controller.workspace = true

# Android (src/android.rs): winit's NativeActivity backend (android-activity,
# re-exported as `winit::platform::android::activity`); libc (cfg(unix)
# below) for the stderr → logcat pipe; jni (the version android-activity
# uses) for the immersive mode and cutout insets, which only Java APIs offer.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
jni = "0.22.4"

# Process CPU time for the performance overlay (perf.rs).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Unix (incl. Android): process CPU time (perf.rs), the logcat pipe (android.rs).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
# Windows exe resource (pw64.rc: icon + VERSIONINFO; build.rs gates on the
# target OS so Linux-target clippy/cross builds stay clean).
embed-resource.workspace = true
