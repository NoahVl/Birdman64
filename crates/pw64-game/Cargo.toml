[package]
name = "pw64-game"
description = "The decomp's C game code (kernel + app + libultra audio/sprite libs), compiled natively with zig clang (Windows COFF / Linux ELF; legacy: PW64_CC=clang-cl|clang)"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "pw64game"

# Exactly one of the two (build.rs asserts it).
[features]
default = ["static"]
# Dev/test build: build.rs compiles the decomp C and links it into the exe,
# with the Rust ports of ported.txt (pw64-kernel).
static = ["dep:pw64-kernel"]
# Release "build on first run" (docs/notes/first-run-build.md): no C and no
# ports in the exe; the game module (DLL/.so, built on the player's machine
# with zig) is loaded at runtime at 0xB0000000 (src/dylib.rs).
dylib = []

[[test]]
name = "kernel_diff"
required-features = ["static"]

[build-dependencies]
cc.workspace = true
pw64-cbuild.workspace = true

[dependencies]
# Defines every symbol the C imports; a dependency so that anything linking
# pw64-game (the exe, this crate's tests) resolves them.
pw64-platform = { path = "../pw64-platform" }
# The Rust ports of ported.txt functions (build.rs renames the C originals to
# pw64_c_<name>): the archive references uvVec3Add, … so every binary that
# links pw64-game (the exe, tests) must link these too. A normal dependency
# (plus `use pw64_kernel as _;` in lib.rs) makes that automatic.
# tests/kernel_diff.rs proves each port bit-identical to its C original.
pw64-kernel = { path = "../pw64-kernel", optional = true }

# Linux: mmap of the RDRAM window (memmap.rs).
[target.'cfg(unix)'.dependencies]
libc.workspace = true
